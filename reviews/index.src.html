  <script type="text/babel">
    const GLASSDOOR = 'https://www.glassdoor.com/Overview/Working-at-xFusion-EI_IE4100993.11,18.htm';

    function ReviewQuote({ text, name, role }) {
      return (
        <div style={{ borderLeft: '3px solid #E4DAC9', padding: '4px 0 4px 22px', marginBottom: 28 }}>
          <p style={{ fontFamily: "'Source Serif 4', serif", fontSize: 'clamp(19px, 2.4vw, 24px)', fontStyle: 'italic', lineHeight: 1.4, color: '#1F1A17', margin: '0 0 12px' }}>&ldquo;{text}&rdquo;</p>
          <div style={{ fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 14.5, color: '#3A322D' }}>
            <strong style={{ fontWeight: 600 }}>{name}</strong>{role ? `, ${role}` : ''}
          </div>
        </div>
      );
    }

    function ReviewsPage() {
      const results = [
        { stat: '98.9%', text: 'CSAT held at TheReceptionist while ticket volume grew 6x.', href: '/case-studies/the-receptionist/' },
        { stat: '84.79%', text: 'reduction in average reply time at SavvyCal.', href: '/case-studies/savvycal/' },
        { stat: '1 → 11', text: 'from one specialist to an 11-person team at Tolstoy.', href: '/case-studies/tolstoy/' },
        { stat: '$60M', text: 'Series B raised in 2026 by Aligned, whose customer support runs with xFusion.', href: null },
        { stat: '91.9%', text: 'CSAT across 185 countries at SkyFi, which raised an oversubscribed $12.7M Series A in 2026.', href: '/case-studies/skyfi/' },
      ];
      const glass = [
        { num: '4.6 / 5', label: 'employee rating (16 reviews), 20% above the staffing-industry average' },
        { num: '100%', label: 'would recommend working here to a friend' },
        { num: '100%', label: 'CEO approval' },
        { num: '93%', label: 'positive business outlook' },
      ];
      return (
        <div data-screen-label="Reviews">
          <Nav current="reviews" />
          <main>
            {/* Hero */}
            <Section bg="paper" padding="md">
              <Container narrow>
                <Eyebrow>Reviews</Eyebrow>
                <h1 style={{ fontFamily: "'Source Serif 4', serif", fontSize: 'clamp(34px, 5vw, 54px)', fontWeight: 600, lineHeight: 1.06, letterSpacing: '-0.02em', margin: '0 0 20px', color: '#1F1A17' }}>
                  What people say about working with us, and working here.
                </h1>
                <p style={{ fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 18, lineHeight: 1.6, color: '#3A322D', margin: 0, maxWidth: 640 }}>
                  We&rsquo;re a small company with a short list of clients and a long list of receipts.
                  Results below link to the case study, and employee ratings link to Glassdoor. If
                  you&rsquo;re doing diligence on xFusion, this page is the shortcut.
                </p>
              </Container>
            </Section>

            {/* What clients say */}
            <Section bg="paper-2" padding="md">
              <Container narrow>
                <h2 style={{ fontFamily: "'Source Serif 4', serif", fontSize: 'clamp(26px, 3.4vw, 36px)', fontWeight: 600, letterSpacing: '-0.02em', margin: '0 0 30px' }}>What clients say</h2>
                <ReviewQuote
                  text="I work with xFusion, and they are truly incredible. I'm glad I found them. They handle the support for our Shopify app and are doing a fantastic job."
                  name="Jean-Noël Mathonnet" role="Shopify app founder" />
                <ReviewQuote
                  text="The xFusion team has been an absolute game-changer for Tolstoy. Working with them has enabled us to grow faster and more professionally than we ever could have alone. I can't praise and thank the team enough. This partnership is so valuable to our company."
                  name="Dov Kaufmann" role="Tolstoy" />
                <ReviewQuote
                  text="I was sure outsourcing would mean dropped tickets and an exploding workload. None of that happened. It was extraordinary instead."
                  name="Tom Foster" role="TheReceptionist" />
                <ReviewQuote
                  text="A timely, friendly response from a human that had all the info I needed to get unstuck. Repeated that process two more times."
                  name="Roy Tomeij" role="Founder, AppSignal, on the support behind SavvyCal" />

                <div className="rv-results" style={{ display: 'grid', gridTemplateColumns: 'repeat(5, 1fr)', gap: 18, marginTop: 20 }}>
                  {results.map((r, i) => {
                    const inner = (
                      <>
                        <div style={{ fontFamily: "'Source Serif 4', serif", fontSize: 26, fontWeight: 600, color: '#B8512C', lineHeight: 1, marginBottom: 8 }}>{r.stat}</div>
                        <div style={{ fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 13.5, lineHeight: 1.5, color: '#3A322D' }}>{r.text}</div>
                        {r.href ? <div style={{ fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 13, fontWeight: 500, color: '#B8512C', marginTop: 8 }}>Read the case study &rarr;</div> : null}
                      </>
                    );
                    return r.href
                      ? <a key={i} href={r.href} style={{ display: 'block', textDecoration: 'none', border: '1px solid #D9CFBF', borderRadius: 12, padding: '20px 18px' }}>{inner}</a>
                      : <div key={i} style={{ border: '1px solid #D9CFBF', borderRadius: 12, padding: '20px 18px' }}>{inner}</div>;
                  })}
                </div>
              </Container>
            </Section>

            {/* What our team says */}
            <Section bg="paper" padding="md">
              <Container narrow>
                <h2 style={{ fontFamily: "'Source Serif 4', serif", fontSize: 'clamp(26px, 3.4vw, 36px)', fontWeight: 600, letterSpacing: '-0.02em', margin: '0 0 18px' }}>What our team says</h2>
                <p style={{ fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 16, lineHeight: 1.6, color: '#3A322D', margin: '0 0 28px', maxWidth: 640 }}>
                  Support quality is a retention problem in disguise. Specialists who are paid well,
                  managed well, and respected stay for years, and a specialist who stays is one who
                  knows your product cold. So we hold ourselves to public account on both sides of
                  the relationship.
                </p>
                <div className="rv-glass" style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 18, marginBottom: 30 }}>
                  {glass.map((g, i) => (
                    <a key={i} href={GLASSDOOR} target="_blank" rel="noopener" style={{ display: 'block', textDecoration: 'none', background: '#F8EBC9', border: '1px solid #E6C683', borderRadius: 12, padding: '20px 18px' }}>
                      <div style={{ fontFamily: "'Source Serif 4', serif", fontSize: 26, fontWeight: 600, color: '#1F1A17', lineHeight: 1, marginBottom: 8 }}>{g.num}</div>
                      <div style={{ fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 13.5, lineHeight: 1.5, color: '#3A322D' }}>{g.label}</div>
                    </a>
                  ))}
                </div>
                <ReviewQuote text="As I'm about to complete my second year here, I'm working hard to do well in my current job to show my appreciation." name="xFusion support specialist" role="anonymous employee survey" />
                <ReviewQuote text="Joining this team opened my eyes to capabilities I never knew I had." name="xFusion support specialist" role="anonymous employee survey" />
                <p style={{ fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 16, color: '#3A322D', margin: 0 }}>
                  Curious what it&rsquo;s like on the inside?{' '}
                  <a href="/careers/" style={{ color: '#B8512C', fontWeight: 500 }}>See Life at xFusion &rarr;</a>
                </p>
              </Container>
            </Section>

            {/* Verify it: skin-in-the-game proof, all public */}
            <Section bg="paper-2" padding="md">
              <Container narrow>
                <h2 style={{ fontFamily: "'Source Serif 4', serif", fontSize: 'clamp(24px, 3vw, 32px)', fontWeight: 600, letterSpacing: '-0.02em', margin: '0 0 16px' }}>Don&rsquo;t take our word for it.</h2>
                <p style={{ fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 16, lineHeight: 1.6, color: '#3A322D', margin: '0 0 22px', maxWidth: 640 }}>
                  We don&rsquo;t chase reviews as a growth tactic. Our proof is named clients with real
                  numbers, and a 30-day risk-free trial where we absorb every dollar of recruiting and
                  training if we don&rsquo;t earn our place. It&rsquo;s all public, and easy to check:
                </p>
                <ul style={{ fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 16, lineHeight: 1.9, color: '#3A322D', margin: 0, paddingLeft: 20 }}>
                  <li>Google Reviews, 5.0 stars</li>
                  <li><a href={GLASSDOOR} target="_blank" rel="noopener" style={{ color: '#B8512C', fontWeight: 500 }}>Glassdoor, 4.6 stars</a></li>
                  <li><a href="/case-studies/" style={{ color: '#B8512C', fontWeight: 500 }}>Case studies</a>, 7 published with named clients and real numbers</li>
                  <li><a href="https://www.linkedin.com/company/xfusion-customer-support" target="_blank" rel="noopener" style={{ color: '#B8512C', fontWeight: 500 }}>LinkedIn</a></li>
                </ul>
              </Container>
            </Section>

            {/* Closing CTA */}
            <Section bg="paper" padding="md" style={{ textAlign: 'center' }}>
              <Container narrow>
                <h2 style={{ fontFamily: "'Source Serif 4', serif", fontSize: 'clamp(28px, 3.6vw, 40px)', fontWeight: 600, letterSpacing: '-0.02em', margin: '0 0 14px' }}>The fastest way to evaluate us is a conversation.</h2>
                <p style={{ fontFamily: "'IBM Plex Sans', sans-serif", fontSize: 16, color: '#3A322D', margin: '0 auto 28px', maxWidth: 520, lineHeight: 1.6 }}>
                  Come with your messiest support problem. 30 minutes, no pitch deck. If we&rsquo;re not the
                  right fit, we&rsquo;ll tell you.
                </p>
                <Button variant="primary" size="lg" href="/book/" onClick={() => (window.xfBookClick ? window.xfBookClick('reviews') : null)}>Book a Discovery Call</Button>
                <CTAMicrocopy color="#6B5F56" style={{ marginLeft: 'auto', marginRight: 'auto', maxWidth: 580 }}>
                  30 minutes. No commitment. No credit card. You&rsquo;ll talk directly with our founding team.
                </CTAMicrocopy>
              </Container>
            </Section>
          </main>
          <Footer />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<ReviewsPage />);
